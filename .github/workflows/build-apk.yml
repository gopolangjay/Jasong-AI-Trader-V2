name: Build Jasong AI Trader APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Jasong AI Trader APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ============================================================
      # 4. FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      # ============================================================
      # 5. SHOW TOOLCHAIN
      # ============================================================
      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      # ============================================================
      # 6. FLUTTER DOCTOR
      # ============================================================
      - name: Flutter doctor
        run: flutter doctor -v

      # ============================================================
      # 7. VERIFY PROJECT
      # ============================================================
      - name: Verify Android project
        run: |
          test -f mobile/pubspec.yaml
          test -f mobile/lib/main.dart
          test -f mobile/android/settings.gradle
          test -f mobile/android/build.gradle
          test -f mobile/android/app/build.gradle
          test -f mobile/android/gradlew
          test -f mobile/android/gradle/wrapper/gradle-wrapper.properties

          echo "Project files verified."

      # ============================================================
      # 8. LOCAL.PROPERTIES
      # ============================================================
      - name: Configure local.properties
        working-directory: mobile
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"

          {
            echo "flutter.sdk=$FLUTTER_SDK"
            echo "sdk.dir=$ANDROID_HOME"
          } > android/local.properties

          echo "Android local.properties configured."

      # ============================================================
      # 9. GRADLE WRAPPER
      # ============================================================
      - name: Verify Gradle wrapper
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --version

      # ============================================================
      # 10. DISABLE GRADLE FILE WATCHING IN CI
      # ============================================================
      - name: Configure Gradle CI settings
        run: |
          mkdir -p "$HOME/.gradle"

          {
            echo "org.gradle.daemon=false"
            echo "org.gradle.vfs.watch=false"
          } >> "$HOME/.gradle/gradle.properties"

          cat "$HOME/.gradle/gradle.properties"

      # ============================================================
      # 11. DEPENDENCIES
      # ============================================================
      - name: Get Flutter packages
        working-directory: mobile
        run: flutter pub get

      # ============================================================
      # 12. ANALYSE
      # ============================================================
      - name: Analyse Flutter code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # ============================================================
      # 13. CLEAN
      # ============================================================
      - name: Clean Flutter and Gradle
        working-directory: mobile
        run: |
          echo "Stopping Gradle daemon..."

          cd android
          ./gradlew --stop || true
          cd ..

          echo "Cleaning Flutter..."
          flutter clean

          echo "Removing old build caches..."
          rm -rf build
          rm -rf android/.gradle

          echo "Restoring packages..."
          flutter pub get

      # ============================================================
      # 14. BUILD WITH FLUTTER
      # ============================================================
      - name: Build release APK with Flutter
        id: flutter_build
        working-directory: mobile
        continue-on-error: true
        run: |
          set -o pipefail

          rm -f flutter-build.log

          flutter build apk --release -v \
            2>&1 | tee flutter-build.log

      # ============================================================
      # 15. LOOK FOR APK CREATED BY FLUTTER / GRADLE
      # ============================================================
      - name: Find Flutter APK
        id: find_flutter_apk
        working-directory: mobile
        run: |
          mkdir -p dist

          echo "Searching for generated APK files..."

          find . \
            -type f \
            -name "*.apk" \
            -print || true

          APK="$(find build android \
            -type f \
            \( -name "app-release.apk" -o -name "*release*.apk" \) \
            -print \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -n "$APK" ] && [ -f "$APK" ]; then
            echo "APK found: $APK"

            cp "$APK" \
              dist/Jasong-AI-Trader-release.apk

            echo "flutter_apk_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No APK found after Flutter build."
            echo "flutter_apk_found=false" >> "$GITHUB_OUTPUT"
          fi

      # ============================================================
      # 16. DIRECT GRADLE FALLBACK
      #
      # If Flutter's APK locator fails, build the Android release
      # directly. This exposes the real Gradle error if one exists.
      # ============================================================
      - name: Build APK directly with Gradle
        if: steps.find_flutter_apk.outputs.flutter_apk_found != 'true'
        working-directory: mobile/android
        run: |
          set -o pipefail

          echo "Flutter did not produce/find an APK."
          echo "Running Gradle assembleRelease directly..."

          ./gradlew app:assembleRelease \
            --no-daemon \
            --no-watch-fs \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

      # ============================================================
      # 17. RECOVER GRADLE APK
      # ============================================================
      - name: Recover Gradle APK
        if: steps.find_flutter_apk.outputs.flutter_apk_found != 'true'
        working-directory: mobile
        run: |
          mkdir -p dist

          echo "Searching for APK after Gradle assembleRelease..."

          find . \
            -type f \
            -name "*.apk" \
            -print || true

          APK="$(find build android \
            -type f \
            \( -name "app-release.apk" -o -name "*release*.apk" \) \
            -print \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo ""
            echo "ERROR: Gradle did not produce a release APK."
            echo ""

            if [ -f gradle-build.log ]; then
              echo "Last 300 Gradle log lines:"
              tail -n 300 gradle-build.log
            fi

            exit 1
          fi

          echo "Gradle APK found:"
          echo "$APK"

          cp "$APK" \
            dist/Jasong-AI-Trader-release.apk

      # ============================================================
      # 18. VERIFY FINAL APK
      # ============================================================
      - name: Verify APK
        working-directory: mobile
        run: |
          APK="dist/Jasong-AI-Trader-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK does not exist."
            exit 1
          fi

          echo ""
          echo "============================================"
          echo "JASONG AI TRADER APK SUCCESSFULLY CREATED"
          echo "============================================"
          echo ""

          ls -lh "$APK"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK"

      # ============================================================
      # 19. UPLOAD APK
      # ============================================================
      - name: Upload Jasong AI Trader APK
        uses: actions/upload-artifact@v4
        with:
          name: Jasong-AI-Trader-APK
          path: mobile/dist/Jasong-AI-Trader-release.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 20. UPLOAD FLUTTER BUILD LOG
      # ============================================================
      - name: Upload Flutter build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK-Build-Log
          path: mobile/flutter-build.log
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # 21. UPLOAD GRADLE BUILD LOG
      # ============================================================
      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-APK-Build-Log
          path: mobile/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
