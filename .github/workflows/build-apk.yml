name: Build Jasong AI Trader APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      # ============================================================
      # 4. SHOW TOOLCHAIN
      # ============================================================
      - name: Show build tool versions
        shell: bash
        run: |
          set -euo pipefail

          echo "================ FLUTTER ================"
          flutter --version

          echo ""
          echo "================ DART ==================="
          dart --version

          echo ""
          echo "================ JAVA ==================="
          java -version

      # ============================================================
      # 5. VERIFY PROJECT FILES
      # ============================================================
      - name: Verify Flutter Android project
        shell: bash
        run: |
          set -euo pipefail

          test -f mobile/pubspec.yaml
          test -f mobile/lib/main.dart
          test -d mobile/android
          test -f mobile/android/settings.gradle
          test -f mobile/android/build.gradle
          test -f mobile/android/app/build.gradle
          test -f mobile/android/gradle/wrapper/gradle-wrapper.properties
          test -f mobile/android/gradlew

          echo "Required Flutter and Android project files found."

      # ============================================================
      # 6. PREPARE GRADLE WRAPPER
      # ============================================================
      - name: Prepare Gradle wrapper
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail

          chmod +x gradlew

          echo "Gradle wrapper configuration:"
          cat gradle/wrapper/gradle-wrapper.properties

          echo ""
          echo "Gradle version:"
          ./gradlew --version

      # ============================================================
      # 7. CONFIGURE FLUTTER / ANDROID SDK PATHS
      # ============================================================
      - name: Configure Android local properties
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail

          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"

          echo "Flutter SDK: $FLUTTER_SDK"
          echo "Android SDK: ${ANDROID_HOME:-}"

          {
            echo "flutter.sdk=$FLUTTER_SDK"

            if [ -n "${ANDROID_HOME:-}" ]; then
              echo "sdk.dir=$ANDROID_HOME"
            fi
          } > android/local.properties

          echo ""
          echo "local.properties:"
          cat android/local.properties

      # ============================================================
      # 8. CONFIGURE GRADLE FOR CI
      # Disable daemon persistence and VFS watching for this runner.
      # ============================================================
      - name: Configure Gradle for CI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.gradle"

          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.daemon=false
          org.gradle.vfs.watch=false
          EOF

          echo "CI Gradle configuration:"
          cat "$HOME/.gradle/gradle.properties"

      # ============================================================
      # 9. FLUTTER PACKAGES
      # ============================================================
      - name: Get Flutter packages
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      # ============================================================
      # 10. FLUTTER ANALYSIS
      # ============================================================
      - name: Analyse Flutter code
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ============================================================
      # 11. CLEAN EVERYTHING BEFORE APK BUILD
      # ============================================================
      - name: Clean Flutter and Gradle build state
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail

          echo "Stopping existing Gradle daemons..."

          (
            cd android
            ./gradlew --stop || true
          )

          echo "Cleaning Flutter..."

          flutter clean

          echo "Removing Android Gradle project cache..."

          rm -rf android/.gradle
          rm -rf build

          echo "Restoring Flutter packages..."

          flutter pub get

          echo "Clean build state ready."

      # ============================================================
      # 12. BUILD RELEASE APK
      #
      # First use the official Flutter APK build.
      # If Flutter fails only because it cannot locate the resulting
      # APK, search for the Gradle-generated release APK.
      #
      # If no APK exists, run Gradle assembleRelease directly so
      # the real Android error and stack trace are captured.
      # ============================================================
      - name: Build release APK
        working-directory: mobile
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"
        run: |
          set -uo pipefail

          mkdir -p dist

          rm -f build.log
          rm -f dist/Jasong-AI-Trader-release.apk

          echo "================================================"
          echo "BUILDING JASONG AI TRADER RELEASE APK"
          echo "================================================"
          echo ""

          # --------------------------------------------------------
          # ATTEMPT 1: FLUTTER BUILD
          # --------------------------------------------------------

          set +e

          flutter build apk \
            --release \
            --verbose \
            2>&1 | tee build.log

          FLUTTER_STATUS=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "Flutter build exit code: $FLUTTER_STATUS"
          echo ""

          echo "Searching for APK files after Flutter build..."

          find build android \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

          EXPECTED_APK="build/app/outputs/flutter-apk/app-release.apk"

          # --------------------------------------------------------
          # NORMAL FLUTTER OUTPUT
          # --------------------------------------------------------

          if [ -f "$EXPECTED_APK" ]; then

            echo ""
            echo "Flutter APK found at expected location:"
            echo "$EXPECTED_APK"

            cp "$EXPECTED_APK" \
              dist/Jasong-AI-Trader-release.apk

            echo ""
            echo "APK copied to dist directory."

            exit 0
          fi

          # --------------------------------------------------------
          # FIND APK IF FLUTTER LOST TRACK OF OUTPUT LOCATION
          # --------------------------------------------------------

          FOUND_APK="$(find build android \
            -type f \
            \( -name "app-release.apk" -o -name "*release*.apk" \) \
            -print \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then

            echo ""
            echo "Release APK found at alternate location:"
            echo "$FOUND_APK"

            cp "$FOUND_APK" \
              dist/Jasong-AI-Trader-release.apk

            echo ""
            echo "Recovered APK successfully."

            exit 0
          fi

          # --------------------------------------------------------
          # ATTEMPT 2: DIRECT GRADLE RELEASE BUILD
          # --------------------------------------------------------

          echo ""
          echo "Flutter did not leave a usable APK."
          echo "Running direct Gradle assembleRelease..."
          echo ""

          set +e

          (
            cd android

            ./gradlew app:assembleRelease \
              --no-daemon \
              --no-watch-fs \
              --stacktrace \
              --info
          ) 2>&1 | tee -a build.log

          GRADLE_STATUS=${PIPESTATUS[0]}

          set -e

          echo ""
          echo "Gradle assembleRelease exit code: $GRADLE_STATUS"
          echo ""

          echo "Searching again for generated APK files..."

          find build android \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

          FOUND_APK="$(find build android \
            -type f \
            \( -name "app-release.apk" -o -name "*release*.apk" \) \
            -print \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -n "$FOUND_APK" ] && [ -f "$FOUND_APK" ]; then

            echo ""
            echo "APK generated by Gradle:"
            echo "$FOUND_APK"

            cp "$FOUND_APK" \
              dist/Jasong-AI-Trader-release.apk

            echo ""
            echo "APK recovered successfully."

            exit 0
          fi

          # --------------------------------------------------------
          # BOTH METHODS FAILED
          # --------------------------------------------------------

          echo ""
          echo "================================================"
          echo "APK BUILD FAILED"
          echo "================================================"
          echo ""

          echo "No release APK could be found."

          echo ""
          echo "Last 300 lines of build log:"
          echo "------------------------------------------------"

          tail -n 300 build.log || true

          echo "------------------------------------------------"

          if [ "$GRADLE_STATUS" -ne 0 ]; then
            exit "$GRADLE_STATUS"
          fi

          if [ "$FLUTTER_STATUS" -ne 0 ]; then
            exit "$FLUTTER_STATUS"
          fi

          exit 1

      # ============================================================
      # 13. VERIFY FINAL APK
      # ============================================================
      - name: Verify APK output
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail

          APK="dist/Jasong-AI-Trader-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK was not produced."
            exit 1
          fi

          echo ""
          echo "================================================"
          echo "JASONG AI TRADER APK SUCCESSFULLY CREATED"
          echo "================================================"
          echo ""

          ls -lh "$APK"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK"

      # ============================================================
      # 14. UPLOAD APK
      # ============================================================
      - name: Upload Jasong AI Trader APK
        uses: actions/upload-artifact@v4
        with:
          name: Jasong-AI-Trader-APK
          path: mobile/dist/Jasong-AI-Trader-release.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 15. UPLOAD BUILD LOG
      # Runs even if the APK build fails.
      # ============================================================
      - name: Upload Android build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jasong-AI-Trader-Android-Build-Log
          path: mobile/build.log
          if-no-files-found: ignore
          retention-days: 7
