name: Build Jasong AI Trader APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. Show Flutter version
      - name: Flutter version
        run: flutter --version

      # 5. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      # 6. Make Gradle wrapper executable
      - name: Prepare Gradle wrapper
        working-directory: mobile
        run: chmod +x android/gradlew

      # 7. Install Flutter dependencies
      - name: Get Flutter packages
        working-directory: mobile
        run: flutter pub get

      # 8. Analyse Flutter code
      - name: Analyse Flutter code
        working-directory: mobile
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      # 9. Build APK
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release

      # 10. Verify APK
      - name: Verify APK
        run: |
          APK="mobile/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not created."
            exit 1
          fi

          echo "APK successfully created."
          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload Jasong AI Trader APK
        uses: actions/upload-artifact@v4
        with:
          name: Jasong-AI-Trader-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
