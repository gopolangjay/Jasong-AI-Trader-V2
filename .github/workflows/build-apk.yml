name: Build Jasong AI Trader APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Jasong AI Trader APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: "-Dorg.gradle.vfs.watch=false"

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ============================================================
      # 3. FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      # ============================================================
      # 4. VERIFY BUILD ENVIRONMENT
      #
      # flutter doctor is diagnostic only.
      # Linux GTK warnings must NOT block Android APK compilation.
      # ============================================================
      - name: Verify Android build environment
        shell: bash
        run: |
          echo "============================================"
          echo "FLUTTER"
          echo "============================================"
          flutter --version

          echo ""
          echo "============================================"
          echo "DART"
          echo "============================================"
          dart --version

          echo ""
          echo "============================================"
          echo "JAVA"
          echo "============================================"
          java -version

          echo ""
          echo "============================================"
          echo "ANDROID SDK"
          echo "============================================"
          echo "ANDROID_HOME=${ANDROID_HOME:-not-set}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-set}"

          echo ""
          echo "============================================"
          echo "FLUTTER DOCTOR"
          echo "Diagnostic only - warnings will not fail job"
          echo "============================================"

          flutter doctor -v || true

      # ============================================================
      # 5. VERIFY PROJECT STRUCTURE
      #
      # Do NOT require gradlew here.
      # The wrapper is generated later in this workflow.
      # ============================================================
      - name: Verify Flutter Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking required Flutter/Android project files..."

          test -f mobile/pubspec.yaml || {
            echo "ERROR: mobile/pubspec.yaml missing"
            exit 1
          }

          test -f mobile/lib/main.dart || {
            echo "ERROR: mobile/lib/main.dart missing"
            exit 1
          }

          test -d mobile/android || {
            echo "ERROR: mobile/android missing"
            exit 1
          }

          test -f mobile/android/settings.gradle || {
            echo "ERROR: mobile/android/settings.gradle missing"
            exit 1
          }

          test -f mobile/android/build.gradle || {
            echo "ERROR: mobile/android/build.gradle missing"
            exit 1
          }

          test -f mobile/android/app/build.gradle || {
            echo "ERROR: mobile/android/app/build.gradle missing"
            exit 1
          }

          test -f mobile/android/gradle.properties || {
            echo "ERROR: mobile/android/gradle.properties missing"
            exit 1
          }

          echo ""
          echo "Base Android project structure verified."
          echo "Gradle wrapper will be generated next."

      # ============================================================
      # 6. CONFIGURE LOCAL.PROPERTIES
      # ============================================================
      - name: Configure Android local.properties
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail

          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(cd "$(dirname "$FLUTTER_BIN")/.." && pwd)"

          echo "Flutter SDK: $FLUTTER_SDK"
          echo "Android SDK: ${ANDROID_HOME:-not-set}"

          {
            echo "flutter.sdk=$FLUTTER_SDK"

            if [ -n "${ANDROID_HOME:-}" ]; then
              echo "sdk.dir=$ANDROID_HOME"
            fi
          } > android/local.properties

          echo ""
          echo "local.properties:"
          cat android/local.properties

      # ============================================================
      # 7. INSTALL GRADLE 8.13
      #
      # This provides the standalone Gradle command used to create
      # the missing Gradle wrapper.
      # ============================================================
      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
          cache-provider: basic

      # ============================================================
      # 8. GENERATE GRADLE 8.13 WRAPPER
      #
      # Generate the wrapper inside a clean temporary Gradle project
      # instead of configuring the Android project before the wrapper
      # exists.
      # ============================================================
      - name: Generate Android Gradle 8.13 wrapper
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_DIR="$GITHUB_WORKSPACE/mobile/android"
          TEMP_DIR="$(mktemp -d)"

          cleanup() {
            rm -rf "$TEMP_DIR"
          }

          trap cleanup EXIT

          echo "============================================"
          echo "GENERATING GRADLE 8.13 WRAPPER"
          echo "============================================"
          echo ""

          echo "Installed Gradle:"
          gradle --version

          echo ""
          echo "Android directory:"
          echo "$ANDROID_DIR"

          echo ""
          echo "Temporary wrapper project:"
          echo "$TEMP_DIR"

          # ----------------------------------------------------------
          # Create a completely empty Gradle bootstrap project.
          # This avoids loading the Android Gradle Plugin while the
          # wrapper itself is still missing.
          # ----------------------------------------------------------

          printf 'rootProject.name = "jasong-wrapper-bootstrap"\n' \
            > "$TEMP_DIR/settings.gradle"

          touch "$TEMP_DIR/build.gradle"

          echo ""
          echo "Generating wrapper..."

          (
            cd "$TEMP_DIR"

            gradle wrapper \
              --gradle-version 8.13 \
              --distribution-type bin
          )

          # ----------------------------------------------------------
          # Copy generated wrapper into Flutter Android project.
          # ----------------------------------------------------------

          echo ""
          echo "Installing wrapper into Android project..."

          mkdir -p "$ANDROID_DIR/gradle/wrapper"

          cp "$TEMP_DIR/gradlew" \
            "$ANDROID_DIR/gradlew"

          cp "$TEMP_DIR/gradlew.bat" \
            "$ANDROID_DIR/gradlew.bat"

          cp "$TEMP_DIR/gradle/wrapper/gradle-wrapper.jar" \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar"

          cp "$TEMP_DIR/gradle/wrapper/gradle-wrapper.properties" \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"

          chmod +x "$ANDROID_DIR/gradlew"

          # ----------------------------------------------------------
          # Verify every required wrapper file now exists.
          # ----------------------------------------------------------

          echo ""
          echo "Verifying generated wrapper files..."

          test -f "$ANDROID_DIR/gradlew" || {
            echo "ERROR: gradlew was not generated."
            exit 1
          }

          test -f "$ANDROID_DIR/gradlew.bat" || {
            echo "ERROR: gradlew.bat was not generated."
            exit 1
          }

          test -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.jar" || {
            echo "ERROR: gradle-wrapper.jar was not generated."
            exit 1
          }

          test -f "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" || {
            echo "ERROR: gradle-wrapper.properties was not generated."
            exit 1
          }

          echo ""
          echo "All Gradle wrapper files generated successfully."

          echo ""
          echo "Wrapper configuration:"
          cat "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties"

          # ----------------------------------------------------------
          # Confirm wrapper is explicitly using Gradle 8.13.
          # ----------------------------------------------------------

          grep -F \
            "gradle-8.13-bin.zip" \
            "$ANDROID_DIR/gradle/wrapper/gradle-wrapper.properties" || {
              echo "ERROR: Wrapper is not configured for Gradle 8.13."
              exit 1
            }

          echo ""
          echo "Gradle 8.13 wrapper configuration confirmed."

          # ----------------------------------------------------------
          # Execute generated wrapper.
          # ----------------------------------------------------------

          echo ""
          echo "Testing generated Gradle wrapper..."

          cd "$ANDROID_DIR"

          ./gradlew --version

          echo ""
          echo "============================================"
          echo "GRADLE 8.13 WRAPPER READY"
          echo "============================================"

      # ============================================================
      # 9. VALIDATE ANDROID GRADLE PROJECT
      # ============================================================
      - name: Validate Android Gradle project
        working-directory: mobile/android
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew help \
            --no-daemon \
            --no-watch-fs \
            --stacktrace

      # ============================================================
      # 10. CONFIGURE GRADLE FOR GITHUB ACTIONS
      # ============================================================
      - name: Configure Gradle for CI
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.gradle"

          {
            echo "org.gradle.daemon=false"
            echo "org.gradle.vfs.watch=false"
          } >> "$HOME/.gradle/gradle.properties"

          echo "Gradle CI configuration:"
          cat "$HOME/.gradle/gradle.properties"

      # ============================================================
      # 11. GET FLUTTER DEPENDENCIES
      # ============================================================
      - name: Get Flutter packages
        working-directory: mobile
        shell: bash
        run: |
          set -e
          flutter pub get

      # ============================================================
      # 12 ANALYSE FLUTTER CODE
      # ============================================================
      - name: Analyse Flutter code
        working-directory: mobile
        shell: bash
        run: |
          flutter analyze \
            --no-fatal-infos \
            --no-fatal-warnings

      # ============================================================
      # 13. CLEAN OLD BUILD STATE
      # ============================================================
      - name: Clean Flutter and Gradle build state
        working-directory: mobile
        shell: bash
        run: |
          set -e

          echo "Stopping Gradle daemons..."

          (
            cd android
            ./gradlew --stop || true
          )

          echo ""
          echo "Running Flutter clean..."

          flutter clean

          echo ""
          echo "Removing old Android Gradle cache..."

          rm -rf android/.gradle
          rm -rf build

          echo ""
          echo "Restoring Flutter packages..."

          flutter pub get

          echo ""
          echo "Clean build state ready."

      # ============================================================
      # 14. BUILD APK WITH FLUTTER
      #
      # Do not fail the whole workflow immediately.
      # We first inspect whether Flutter/Gradle created the APK.
      # ============================================================
      - name: Build release APK with Flutter
        id: flutter_build
        working-directory: mobile
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail

          rm -f flutter-build.log

          echo "============================================"
          echo "BUILDING JASONG AI TRADER APK WITH FLUTTER"
          echo "============================================"
          echo ""

          flutter build apk --release -v \
            2>&1 | tee flutter-build.log

      # ============================================================
      # 15. SEARCH FOR FLUTTER APK
      # ============================================================
      - name: Find Flutter APK
        id: find_flutter_apk
        working-directory: mobile
        shell: bash
        run: |
          set -e

          mkdir -p dist

          rm -f dist/Jasong-AI-Trader-release.apk

          echo "============================================"
          echo "SEARCHING FOR APK"
          echo "============================================"

          echo ""
          echo "All APK files found:"

          find . \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

          echo ""

          EXPECTED_APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$EXPECTED_APK" ]; then

            echo "Flutter APK found at expected location:"
            echo "$EXPECTED_APK"

            cp "$EXPECTED_APK" \
              dist/Jasong-AI-Trader-release.apk

            echo "flutter_apk_found=true" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          APK="$(find build android \
            -type f \
            \( -name "app-release.apk" -o -name "*release*.apk" \) \
            -print \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -n "$APK" ] && [ -f "$APK" ]; then

            echo "Release APK found at alternate location:"
            echo "$APK"

            cp "$APK" \
              dist/Jasong-AI-Trader-release.apk

            echo "flutter_apk_found=true" >> "$GITHUB_OUTPUT"

          else

            echo "No release APK found after Flutter build."

            echo "flutter_apk_found=false" >> "$GITHUB_OUTPUT"

          fi

      # ============================================================
      # 16. DIRECT GRADLE FALLBACK
      #
      # If Flutter does not produce/find an APK, run the Android
      # release task directly with full diagnostics.
      # ============================================================
      - name: Build APK directly with Gradle
        id: gradle_build
        if: steps.find_flutter_apk.outputs.flutter_apk_found != 'true'
        continue-on-error: true
        working-directory: mobile/android
        shell: bash
        run: |
          set -o pipefail

          echo "============================================"
          echo "DIRECT GRADLE APK BUILD"
          echo "============================================"
          echo ""

          echo "Flutter did not leave a usable APK."
          echo "Running app:assembleRelease directly..."
          echo ""

          ./gradlew app:assembleRelease \
            --no-daemon \
            --no-watch-fs \
            --stacktrace \
            --info \
            2>&1 | tee ../gradle-build.log

      # ============================================================
      # 17. RECOVER APK FROM GRADLE OUTPUT
      # ============================================================
      - name: Recover Gradle APK
        if: steps.find_flutter_apk.outputs.flutter_apk_found != 'true'
        working-directory: mobile
        shell: bash
        run: |
          set -e

          mkdir -p dist

          echo "============================================"
          echo "SEARCHING FOR GRADLE APK"
          echo "============================================"
          echo ""

          find . \
            -type f \
            -name "*.apk" \
            -print \
            2>/dev/null || true

          echo ""

          APK="$(find build android \
            -type f \
            \( -name "app-release.apk" -o -name "*release*.apk" \) \
            -print \
            2>/dev/null \
            | head -n 1 || true)"

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then

            echo ""
            echo "============================================"
            echo "ERROR: NO RELEASE APK WAS PRODUCED"
            echo "============================================"
            echo ""

            if [ -f flutter-build.log ]; then
              echo "Last 200 lines of Flutter build log:"
              echo "--------------------------------------------"
              tail -n 200 flutter-build.log || true
              echo "--------------------------------------------"
            fi

            if [ -f gradle-build.log ]; then
              echo ""
              echo "Last 300 lines of Gradle build log:"
              echo "--------------------------------------------"
              tail -n 300 gradle-build.log || true
              echo "--------------------------------------------"
            fi

            exit 1
          fi

          echo "Gradle APK found:"
          echo "$APK"

          cp "$APK" \
            dist/Jasong-AI-Trader-release.apk

          echo ""
          echo "APK successfully recovered from Gradle output."

      # ============================================================
      # 18. VERIFY FINAL APK
      # ============================================================
      - name: Verify APK output
        working-directory: mobile
        shell: bash
        run: |
          set -e

          APK="dist/Jasong-AI-Trader-release.apk"

          if [ ! -f "$APK" ]; then

            echo ""
            echo "ERROR: Final APK does not exist."
            echo ""

            exit 1

          fi

          echo ""
          echo "============================================"
          echo "JASONG AI TRADER APK SUCCESSFULLY CREATED"
          echo "============================================"
          echo ""

          ls -lh "$APK"

          echo ""
          echo "SHA-256:"
          sha256sum "$APK"

      # ============================================================
      # 19. UPLOAD APK
      # ============================================================
      - name: Upload Jasong AI Trader APK
        uses: actions/upload-artifact@v4
        with:
          name: Jasong-AI-Trader-APK
          path: mobile/dist/Jasong-AI-Trader-release.apk
          if-no-files-found: error
          retention-days: 30

      # ============================================================
      # 20. UPLOAD FLUTTER BUILD LOG
      #
      # Upload even when the APK build fails.
      # ============================================================
      - name: Upload Flutter build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Flutter-APK-Build-Log
          path: mobile/flutter-build.log
          if-no-files-found: ignore
          retention-days: 7

      # ============================================================
      # 21. UPLOAD GRADLE BUILD LOG
      #
      # Only exists if the fallback Gradle build was needed.
      # ============================================================
      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Gradle-APK-Build-Log
          path: mobile/gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
