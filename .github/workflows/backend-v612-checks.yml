name: V6.12 Adaptive FX backend checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/test_fx_v612_adaptive_policy.py'
      - '.github/workflows/backend-v612-checks.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/test_fx_v612_adaptive_policy.py'
      - '.github/workflows/backend-v612-checks.yml'

jobs:
  v612-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile V6.12 runtime modules
        run: |
          python -m py_compile \
            backend/adaptive_fx_v612.py \
            backend/adaptive_fx_v612_status.py \
            backend/run_server.py
      - name: Run V6.12 focused tests
        run: python tests/test_fx_v612_adaptive_policy.py -v
