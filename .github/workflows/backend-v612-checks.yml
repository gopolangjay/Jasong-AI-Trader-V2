name: Backend regression checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/backend-v612-checks.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'pytest.ini'
      - '.github/workflows/backend-v612-checks.yml'

jobs:
  v612-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Compile backend modules
        run: python -m compileall -q backend
      - name: Run all regression tests
        run: python -m pytest -q tests
      - name: Smoke-test clean runtime without broker orders
        working-directory: backend
        run: python clean_core_smoke.py
